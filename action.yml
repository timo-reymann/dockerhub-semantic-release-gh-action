---
name: dockerhub-semantic-release
description: Utilize semantic-release and publish images to docker hub automatically
branding:
  color: orange
  icon: rotate-ccw

inputs:
  image:
    description: Image slug containting org and image (e.g. user/imagename)
    required: true
    default: null
  dockerhub_username:
    description: Username for docker hub
    required: true
    default: null
  dockerhub_token:
    description: Token for docker hub
    required: true
    default: null
  github_token:
    description: Github token to use
    required: true
    default: null
  platforms:
    description: List of target platforms for build (as specified by docker/build-push-action)
    required: false
    default: null

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Run semantic-release
      id: semantic-release
      uses: cycjimmy/semantic-release-action@v8.1.3
      with:
        semantic_version: 25.0.9
        extra_plugins: |
          @semantic-release/git@10.0.1
          @semantic-release/changelog@6.0.3
          conventional-changelog-conventionalcommits@8.0.0
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
    - name: Setup Docker buildx
      uses: docker/setup-buildx-action@v4
    - name: Compute image tags
      id: image-tags
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        NEW_RELEASE_PUBLISHED: ${{ steps.semantic-release.outputs.new_release_published }}
        NEW_RELEASE_VERSION: ${{ steps.semantic-release.outputs.new_release_version }}
      run: |
        VERSION=''
        if [ "${NEW_RELEASE_PUBLISHED}" = 'true' ]; then
          VERSION="${NEW_RELEASE_VERSION}"
        fi

        ON_DEFAULT_BRANCH='false'
        case "${GITHUB_REF}" in
          refs/heads/main|refs/heads/master) ON_DEFAULT_BRANCH='true' ;;
        esac

        TAGS=''
        add_tag() {
          TAGS="${TAGS:+${TAGS},}${IMAGE}:$1"
        }

        if [ -n "${VERSION}" ]; then
          MAJOR="$(printf '%s' "${VERSION}" | sed -E 's/^([0-9]+).*/\1/')"
          MINOR="$(printf '%s' "${VERSION}" | sed -E 's/^([0-9]+\.[0-9]+).*/\1/')"
          add_tag "${MAJOR}"
          add_tag "${MINOR}"
          add_tag "${VERSION}"
          add_tag 'latest'
        fi

        if [ "${ON_DEFAULT_BRANCH}" = 'true' ]; then
          add_tag 'edge'
        fi

        if [ -n "${TAGS}" ]; then
          {
            echo "push=true"
            echo "tags=${TAGS}"
          } >> "$GITHUB_OUTPUT"
        else
          {
            echo "push=false"
            echo "tags=${IMAGE}:snapshot"
          } >> "$GITHUB_OUTPUT"
        fi
    - name: Build image
      if: steps.image-tags.outputs.push == 'false'
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: ${{ inputs.platforms }}
        push: false
        tags: ${{ inputs.image }}:snapshot
    - name: Login to dockerhub
      if: steps.image-tags.outputs.push == 'true'
      uses: docker/login-action@v4
      with:
        username: ${{ inputs.dockerhub_username }}
        password: ${{ inputs.dockerhub_token }}
    - name: Build and push image
      if: steps.image-tags.outputs.push == 'true'
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: ${{ inputs.platforms }}
        push: true
        sbom: true
        tags: ${{ steps.image-tags.outputs.tags }}
    - name: Docker Hub Description
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: peter-evans/dockerhub-description@v5.0.0
      with:
        username: ${{ inputs.dockerhub_username }}
        password: ${{ inputs.dockerhub_token }}
        repository: ${{ inputs.image }}
        short-description: ${{ github.event.repository.description }}
        enable-url-completion: true
